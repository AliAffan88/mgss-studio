<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MGSS Studio v4</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div style="position: fixed; bottom: 8px; right: 8px; font-size: 12px; opacity: 0.6; background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; z-index: 999;">
    MGSS Studio v4
  </div>

  <div id="app">

    <aside id="toolbar">
      <div class="brand">
        <strong>MGSS Studio v4</strong>
        <button id="themeToggle" type="button">🌙</button>
      </div>

      <div class="section">
        <div class="section-title">Modes</div>
        <div class="tools">
          <button id="polyBtn" class="modeBtn active">Polygon</button>
          <button id="bezierBtn" class="modeBtn">Bezier</button>
          <button id="selectBtn" class="modeBtn">Select</button>
          <button id="handBtn" class="modeBtn">Hand</button>
          <button id="wandBtn" class="modeBtn" title="Magic Wand (Auto-trace)">🪄 Wand</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">View</div>
        <button id="zoomInBtn">Zoom In</button>
        <button id="zoomOutBtn">Zoom Out</button>
        <button id="resetZoomBtn">Reset Zoom</button>
        <button id="fitBtn">Fit to Screen</button>
        <button id="removeBgBtn">Remove Background</button>
      </div>

      <div class="section">
        <div class="section-title">Image / Export</div>
        <label class="file-label">
          Background Image
          <input id="uploadImage" type="file" accept="image/*"/>
        </label>
        <label style="display:block;margin-top:6px;">
          <input type="checkbox" id="lockBgChk" /> Lock Background
        </label>
        <label style="display:block;margin-top:6px;">
          <input type="checkbox" id="includeImage" /> Include image in export
        </label>
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button id="exportPowerBI" class="actionBtn">Export (Power BI)</button>
          <button id="exportFull" class="actionBtn">Export Raw</button>
        </div>
        <div style="margin-top:6px;font-size:12px;color:#666">
          <input id="autosave" type="checkbox" /> Auto-save project
        </div>
      </div>

      <div class="section">
        <div class="section-title">Actions</div>
        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>
        <button id="saveProjectBtn">Save Project</button>
        <input id="loadProjectFile" type="file" accept=".mgss.json" />
      </div>

      <div class="section tips">
        <div class="section-title">Tips</div>
        <ul>
          <li><strong>Alt + Move</strong> (Bezier): Adjust curve</li>
          <li><strong>Shift + Click</strong>: Add vertex</li>
          <li><strong>Right-Click</strong> handle: Delete vertex</li>
          <li><strong>Space + Drag</strong>: Pan canvas</li>
        </ul>
      </div>
    </aside>

    <main id="main">
      <div id="canvasWrapper">
        <svg id="svgCanvas" xmlns="http://www.w3.org/2000/svg" data-zoom="1"></svg>
      </div>
    </main>

    <aside id="sidepanel">

      <div class="section collapsible open" id="regionPropsSection">
        <div class="section-title collapsible-header">
          Region Properties <span class="chevron">▾</span>
        </div>
        <div class="collapsible-body">
          <label>Region ID</label>
          <input id="regionID" placeholder="Auto-generated" />

          <label>Data Field (Synoptic Name)</label>
          <input id="regionField" placeholder="e.g. Sales, Category" />

          <label>Fill Color</label>
          <input id="fillColor" type="color" />

          <label>Opacity</label>
          <input id="fillOpacity" type="range" min="0" max="1" step="0.05" />

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-top:10px;">
            <button id="frontBtn" class="actionBtn">Bring Front</button>
            <button id="backBtn" class="actionBtn">Send Back</button>
            <button id="centerBtn" class="actionBtn">Center View</button>
            <button id="deleteBtn" class="actionBtn" style="color:red;">Delete</button>
          </div>
        </div>
      </div>

      <div class="section collapsible open">
        <div class="section-title collapsible-header">
          Layers / Regions <span class="chevron">▾</span>
        </div>
        <div class="collapsible-body">
          <ul id="regionList"></ul>
        </div>
      </div>

      <div class="section collapsible">
        <div class="section-title collapsible-header">
          Tool Defaults <span class="chevron">▾</span>
        </div>
        <div class="collapsible-body">
          <label>Default Fill</label>
          <input type="color" id="defaultColor" value="#bfbfbf" />
          <label>Default Opacity</label>
          <input type="range" id="defaultOpacity" min="0" max="1" step="0.05" value="0.3" />
        </div>
      </div>

    </aside>
  </div>

  <script src="undoRedo.js"></script>
  <script src="projectIO.js"></script>
  <script src="svgExport.js"></script>
  <script src="app.js"></script>
</body>
</html>
