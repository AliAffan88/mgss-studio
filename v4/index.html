<body>
  <div id="app">
    <aside id="toolbar">
      <div class="brand">
        <strong>MGSS Studio v4</strong>
        <button id="themeToggle" type="button">🌙</button>
      </div>

      <div class="section">
        <div class="section-title">Modes</div>
        <div class="tools">
          <button id="polyBtn" class="modeBtn active">Polygon</button>
          <button id="bezierBtn" class="modeBtn">Bezier</button>
          <button id="selectBtn" class="modeBtn">Select</button>
          <button id="handBtn" class="modeBtn">Hand</button>
          <button id="wandBtn" class="modeBtn">Magic Wand</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">View</div>
        <button id="zoomInBtn">Zoom In</button>
        <button id="zoomOutBtn">Zoom Out</button>
        <button id="resetZoomBtn">Reset Zoom</button>
        <button id="fitBtn">Fit to Screen</button>
        <button id="removeBgBtn">Remove Background</button>
      </div>

      <div class="section">
        <div class="section-title">Image / Export</div>
        <label class="file-label">
          Background Image
          <input id="uploadImage" type="file" accept="image/*"/>
        </label>
        <label style="display:block;margin-top:6px;">
          <input type="checkbox" id="lockBgChk" /> Lock Background
        </label>
        <label style="display:block;margin-top:6px;">
          <input type="checkbox" id="includeImage" /> Include image in export
        </label>
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button id="exportPowerBI" class="actionBtn">Export (PBI)</button>
          <button id="exportFull" class="actionBtn">Export Full</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Actions</div>
        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>
        <button id="saveProjectBtn">Save Project</button>
        <input id="loadProjectFile" type="file" accept=".mgss.json" />
      </div>
    </aside>

    <main id="main">
      <div id="canvasWrapper">
        <svg id="svgCanvas" xmlns="http://www.w3.org/2000/svg" data-zoom="1"></svg>
      </div>
    </main>

    <aside id="sidepanel">
      <div class="section collapsible open" id="regionPropsSection">
        <div class="section-title collapsible-header">Region Properties <span>▾</span></div>
        <div class="collapsible-body">
          <label>Region ID</label>
          <input id="regionID" />
          <label>Data Field</label>
          <input id="regionField" />
          <label>Fill Color</label>
          <input id="fillColor" type="color" />
          <label>Opacity</label>
          <input id="fillOpacity" type="range" min="0" max="1" step="0.05" />
          <div style="display:flex;gap:4px;margin-top:8px;">
            <button id="frontBtn" class="actionBtn">Bring Front</button>
            <button id="backBtn" class="actionBtn">Send Back</button>
          </div>
          <button id="centerBtn" class="actionBtn" style="margin-top:4px;">Center View</button>
        </div>
      </div>

      <div class="section collapsible open">
        <div class="section-title collapsible-header">Regions <span>▾</span></div>
        <div class="collapsible-body">
          <ul id="regionList"></ul>
        </div>
      </div>
    </aside>
  </div>

  <script src="undoRedo.js"></script>
  <script src="projectIO.js"></script>
  <script src="svgExport.js"></script>
  <script src="app.js"></script>
</body>
